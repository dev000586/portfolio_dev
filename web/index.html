<!DOCTYPE html>
<html lang="en">

<head>

    <!--
      Base path for Flutter web.
      Automatically replaced during build.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <!-- ========================= -->
    <!-- Basic Meta Configuration -->
    <!-- ========================= -->

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Mobile responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ================= -->
    <!-- SEO Meta Tags -->
    <!-- ================= -->

    <!-- Browser title -->
    <title>Rishabh Dev Narayan | Flutter Developer</title>

    <!-- Search engine description -->
    <meta
            name="description"
            content="Experienced Flutter Developer specializing in cross-platform mobile, web, and desktop applications with scalable architecture and modern UI/UX."
    />

    <!-- SEO keywords -->
    <meta
            name="keywords"
            content="Flutter Developer, Dart, Firebase, Android, iOS, Mobile Developer, Web Developer, Rishabh Dev Narayan, Rishabh, Dev, Narayan, Flutter App Developer, Mobile Application Developer"
    />

    <!-- Author -->
    <meta name="author" content="Rishabh Dev Narayan">

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow">

    <!-- Browser toolbar color -->
    <meta name="theme-color" content="#0F172A">

    <!-- ===================================== -->
    <!-- Open Graph Tags (WhatsApp/LinkedIn) -->
    <!-- ===================================== -->

    <!-- Content type -->
    <meta property="og:type" content="website">

    <!-- Website title -->
    <meta
            property="og:title"
            content="Rishabh Dev Narayan | Flutter Developer"
    >

    <!-- Website description -->
    <meta
            property="og:description"
            content="Flutter Developer with 6+ years of experience building scalable mobile, web, and desktop applications."
    >

    <!-- Website URL -->
    <meta
            property="og:url"
            content="https://dev000586-portfolio.web.app/"
    >

    <!-- Social preview image -->
    <!-- Uses internal hosted image -->
    <meta
            property="og:image"
            content="https://dev000586-portfolio.web.app/icons/Icon-192.png"
    >

    <!-- Optional image dimensions -->
    <meta property="og:image:width" content="192">
    <meta property="og:image:height" content="192">

    <!-- ===================== -->
    <!-- Twitter Preview Tags -->
    <!-- ===================== -->

    <!-- Large preview card -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Twitter title -->
    <meta
            name="twitter:title"
            content="Rishabh Dev Narayan | Flutter Developer"
    >

    <!-- Twitter description -->
    <meta
            name="twitter:description"
            content="Cross-platform Flutter Developer building modern mobile, web, and desktop applications."
    >

    <!-- Twitter preview image -->
    <meta
            name="twitter:image"
            content="https://dev000586-portfolio.web.app/icons/Icon-192.png"
    >

    <!-- ===================== -->
    <!-- Apple / iOS Settings -->
    <!-- ===================== -->

    <!-- iOS standalone support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- iOS status bar -->
    <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
    >

    <!-- iOS app title -->
    <meta
            name="apple-mobile-web-app-title"
            content="Rishabh Dev Narayan"
    >

    <!-- ================= -->
    <!-- Icons & Manifest -->
    <!-- ================= -->

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Canonical URL -->
    <link
            rel="canonical"
            href="https://dev000586-portfolio.web.app/"
    >

</head>

<body>

<!-- Flutter Web Bootstrap -->
<script src="flutter_bootstrap.js" async></script>

</body>

</html>
