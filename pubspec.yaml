name: flutter_portfolio
description: A creative, interactive Flutter developer portfolio app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  animate_do: ^5.1.0
  flutter_staggered_animations: ^1.1.1
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  animated_text_kit: ^4.3.0
  flutter_svg: ^2.3.0
  lottie: ^3.3.3
  cupertino_icons: ^1.0.9
  smooth_page_indicator: ^2.0.1
  font_awesome_flutter: ^11.0.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  palette_generator_master: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
