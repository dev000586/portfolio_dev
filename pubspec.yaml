name: flutter_portfolio
description: A creative, interactive Flutter developer portfolio app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.1.1
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  animated_text_kit: ^4.2.2
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^1.2.0+3
  font_awesome_flutter: ^10.7.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
